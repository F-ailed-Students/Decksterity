version: "3.9"

services:
  card_db:
    image: postgres:15
    container_name: card_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  card_backend:
    build: ./backend
    container_name: card_backend
    depends_on:
      - card_db
    environment:
      DATABASE_URL: postgresql://user:password@card_db:5432/mydb
      DECKSTERITY_SECRET_KEY: "super_secret_key_change_this_in_production"
    ports:
      - "8000:8000"

  card_frontend:
    build: ./frontend
    container_name: card_frontend
    ports:
      - "3000:80"
    depends_on:
      - card_backend

volumes:
  db_data: